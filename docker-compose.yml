version: '3.8'

services:
  frontend:
    build:
      context: ./Jgec-Alumni-Frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./Jgec_Alumni_Backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./Jgec_Alumni_Backend/public:/app/public

  admin:
    build:
      context: ./Jgec-alumni-admin
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
